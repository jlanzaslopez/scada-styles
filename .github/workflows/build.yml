name: Build & Deploy Style Viewer

on:
  push:
    branches: [main]
    paths:
      - 'styles/**.xml'
      - 'generate_viewer.py'
      - 'docs/index.html'
      - 'docs/viewer.css'
      - 'docs/viewer.js'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate data files
        run: python generate_viewer.py --all styles/ docs/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
